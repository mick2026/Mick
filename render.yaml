# Blueprint di Render per Studio Amico (cartella studio/). Vedi studio/docs/DEPLOY.md.
services:
  - type: web
    name: studio-amico
    runtime: docker
    dockerfilePath: ./studio/Dockerfile
    dockerContext: ./studio
    region: frankfurt
    # free per le prove (si "addormenta" dopo 15 minuti); starter (~7 $/mese) per l'uso quotidiano
    plan: free
    healthCheckPath: /api/salute
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "8080"
      - key: LIMITE_PROVA
        value: "5"
      - key: LIMITE_ABBONATO
        value: "40"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        value: https://studio-amico.onrender.com
      - key: EMAIL_MITTENTE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
