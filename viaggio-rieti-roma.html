<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rieti e Roma con Emma</title>
<style>
:root{--bg:#eef0ec;--surface:#fbfbf9;--ink:#1d2330;--muted:#5d6472;--line:#d7dad3;--accent:#8a1f3d;--err:#a2260e}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--surface:#1c2028;--ink:#e7e9ee;--muted:#a2a8b4;--line:#2e3440;--accent:#e2789a;--err:#f08a6c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font:700 22px/1.2 Georgia,serif;letter-spacing:.03em;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:14px;font-weight:600}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:600 16px system-ui,sans-serif;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--err);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Rieti e Roma con Emma</h1>
  <p>Pagina privata del viaggio. Inserisci la password.</p>
  <input type="text" name="username" value="viaggio" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="chk"><input id="keep" type="checkbox" checked> Ricorda su questo dispositivo</label>
  <button id="go" type="submit">Apri</button>
  <div id="err" role="alert"></div>
</form>

async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
  document.open();document.write(html);document.close();
}
const K="viaggio-pw";

  try{const keep=document.getElementById("keep").checked;try{keep?localStorage.setItem(K,pw):localStorage.removeItem(K)}catch{}await open(pw)}
